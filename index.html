<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>전국 아파트 시세 지도</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MKQKWLQ36G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-MKQKWLQ36G');
  </script>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- 여기에 본인 카카오 JavaScript 키 입력 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e20cff92c58427130124c1da5daeecc3&libraries=services"></script>
</head>

<body>
  <header class="top-bar">
    <div class="title">🏘 전국 아파트 시세 지도</div>

    <select id="regionSelect">
      <option value="">지역 선택</option>
    </select>

    <select id="mapTypeSelect">
      <option value="basic">기본 지도</option>
      <option value="skyview">위성 지도</option>
      <option value="terrain">지적 지도</option>
    </select>


    <button id="captureBtn">📷 화면 저장</button>

    <button type="button" id="refreshDataBtn" class="refresh-data-btn">
      🔄 최신 시세
    </button>

    <label for="csvUploadInput" class="csv-upload-btn">
      📂 CSV 직접 업로드
    </label>

    <input type="file" id="csvUploadInput" accept=".csv" style="display: none;" />
  </header>

  <main class="layout">
    <aside class="side-panel">
      <div class="list-header">
        단지 목록 (<span id="aptCount">0</span>개)
      </div>

      <input type="text" id="searchInput" placeholder="단지명 검색" />

      <label class="global-search-option">
        <input type="checkbox" id="globalSearchCheck" checked />
        전국에서 검색
      </label>

      <div class="select-buttons">
        <button id="selectAllBtn" class="reset-filter-btn">
          전체 선택
        </button>

        <button id="unselectAllBtn" class="reset-filter-btn">
          전체 해제
        </button>
      </div>

      <div class="quick-select-buttons">
        <button type="button" id="clearAptSelectionBtn" class="quick-select-btn">
          선택 단지 초기화
        </button>

        <button type="button" id="addSearchResultsBtn" class="quick-select-btn">
          선택 단지 추가
        </button>
      </div>

      <div id="selectedAptCount" class="selected-apt-count">
        선택 단지 0개
      </div>

      <div id="selectedAptList" class="selected-apt-list">
        선택된 단지가 없습니다.
      </div>

      <div class="size-filter">
        <div class="filter-title">평형대</div>

        <label>
          <input type="checkbox" class="sizeCheck" value="10" checked />
          10평대
        </label>

        <label>
          <input type="checkbox" class="sizeCheck" value="20" checked />
          20평대
        </label>

        <label>
          <input type="checkbox" class="sizeCheck" value="30" checked />
          30평대
        </label>

        <label>
          <input type="checkbox" class="sizeCheck" value="40" checked />
          40평대
        </label>

        <label>
          <input type="checkbox" class="sizeCheck" value="50" checked />
          50평대+
        </label>
      </div>

      <div class="filter-section">
        <div class="filter-title">정보박스 표시</div>

        <div class="detail-mode-buttons">
          <button type="button" class="detail-mode-btn" data-level="summary">
            요약
          </button>

          <button type="button" class="detail-mode-btn active" data-level="normal">
            기본
          </button>

          <button type="button" class="detail-mode-btn" data-level="detail">
            상세
          </button>
        </div>

        <div class="overlay-font-control">
          <div class="filter-title overlay-font-title">
            정보박스 글씨
          </div>

          <div class="font-size-buttons">
            <button type="button" id="fontSizeDownBtn">
              작게
            </button>

            <span id="fontSizeValue">
              100%
            </span>

            <button type="button" id="fontSizeUpBtn">
              크게
            </button>
          </div>

          <button type="button" id="fontSizeResetBtn">
            기본 크기
          </button>
        </div>
      </div>

      <div class="price-filter">
        <button type="button" id="priceToggle" class="filter-toggle">
          가격대 ▼
        </button>

        <div id="priceContent" class="price-content">
          <div class="price-inputs">
            <label>
              최소
              <input type="number" id="minPriceInput" value="1" min="0" max="200" step="0.1" />
              억
            </label>

            <label>
              최대
              <input type="number" id="maxPriceInput" value="200" min="0" max="200" step="0.1" />
              억
            </label>
          </div>

          <button id="applyPriceBtn" class="apply-price-btn">
            가격대 적용
          </button>

          <div class="region-selection-buttons">
            <button type="button" id="selectCurrentRegionBtn" class="region-selection-btn">
              현재 지역 전체 선택
            </button>

            <button type="button" id="unselectCurrentRegionBtn" class="region-selection-btn">
              현재 지역 전체 해제
            </button>
          </div>
        </div>
      </div>

      <div id="aptList" class="apt-list"></div>

      <div id="resizeHandle" class="resize-handle"></div>
    </aside>

    <section class="map-area">
      <div id="map"></div>

      <button type="button" id="currentLocationBtn" class="current-location-fab" aria-label="현재 위치로 이동"
        title="현재 위치로 이동">
        <svg class="current-location-svg" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 2V5"></path>
          <path d="M12 19V22"></path>
          <path d="M2 12H5"></path>
          <path d="M19 12H22"></path>
        </svg>
      </button>

      <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
          <div class="loading-spinner"></div>

          <div id="loadingText" class="loading-text">
            아파트 시세 데이터를 불러오는 중입니다.
          </div>

          <div class="loading-subtext">
            단지 수에 따라 잠시 시간이 걸릴 수 있습니다.
          </div>
        </div>
      </div>
      <div class="legend">
        <button id="legendToggle">가격 색상표 보기</button>
        <div id="legendContent" class="legend-content hidden"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
